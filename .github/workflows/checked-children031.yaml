name: Temporary formal child-list migration
on:
  pull_request:
    paths:
      - migration/checked-children031.cirru
      - .github/workflows/checked-children031.yaml
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit
          deps-file: deps.cirru
      - name: Check child-list boundaries with official CLI
        run: |
          set -euo pipefail
          out=.calcit/checked-children031
          mkdir -p "$out"
          git hash-object calcit.cirru > "$out/before-blob.txt"
          calcit edit transaction --file migration/checked-children031.cirru --dry-run --format json > "$out/preview.json"
          revision="$(jq -er '.scoped_revision' "$out/preview.json")"
          jq -e '(.operations | length) == 6' "$out/preview.json"
          calcit edit transaction --file migration/checked-children031.cirru --expect-revision "$revision" --format json > "$out/applied.json"
          calcit analyze program-diff HEAD --format json > "$out/program-diff.json"
          cp calcit.cirru "$out/calcit.cirru"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: explain-ternary-checked-children
          path: .calcit/checked-children031/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
