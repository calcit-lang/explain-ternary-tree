name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: upload-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Set up Calcit and Caps
        uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Resolve immutable dependencies
        run: |
          # Published dependencies request different compatible js-ffi and
          # Respo versions; Caps records the deterministic highest selections.
          caps --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Validate Calcit upgrade
        run: |
          test "$(calcit --version)" = "0.27.0"
          test -f calcit.cirru
          test -f deps.cirru
          test ! -e compact.cirru
          test ! -e package.cirru
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze check-public \
            --ns app.comp.container \
            --ns app.comp.fingertree \
            --ns app.comp.ternary-tree \
            --ns app.config \
            --ns app.main \
            --ns app.schema \
            --ns app.task \
            --ns app.updater \
            --summary-only --format json

      - name: Select CDN asset path
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
          fi
          base_url="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

      - name: Build web assets with CDN URLs
        run: |
          yarn compile
          yarn build

      - name: Check COS credentials
        id: cos-credentials
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
            else
              echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
              exit 1
            fi
          fi

      - name: Upload and verify static assets on COS
        timeout-minutes: 10
        if: steps.cos-credentials.outputs.available == 'true'
        uses: worktools/cos-upload-action@17e6d213fe9f6772a6090a13c8ba044cd6cbcb09 # v1.1.1
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          # Bound retransmission for this ~6 MiB bundle instead of retrying
          # a single PUT for hours on a slow runner-to-COS connection.
          part-size: '1'
          thread-num: '2'
          retry-count: '1'
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy web assets to tiye.me
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          ssh_dir="$RUNNER_TEMP/explain-ternary-tree-ssh"
          key_file="$ssh_dir/id_ed25519"
          known_hosts_file="$GITHUB_WORKSPACE/.github/ssh_known_hosts"
          matching_keys="$ssh_dir/tiye.me-ed25519"
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"
          trap 'rm -f "$key_file" "$matching_keys"' EXIT
          awk '$1 == "tiye.me" && $2 == "ssh-ed25519" { print }' "$known_hosts_file" > "$matching_keys"
          test "$(awk 'NF { count += 1 } END { print count + 0 }' "$matching_keys")" -eq 1
          actual_fingerprint="$(ssh-keygen -lf "$matching_keys" | awk '{ print $2 }')"
          test "$actual_fingerprint" = 'SHA256:f0ME3+UEzCM357Vtdic/bay2ygVUULBJ2pfaPTjBYhg'
          rsync -avzr --progress \
            -e "ssh -i $key_file -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file" \
            dist/* "rsync-user@tiye.me:/web-assets/repo/${GITHUB_REPOSITORY}"
