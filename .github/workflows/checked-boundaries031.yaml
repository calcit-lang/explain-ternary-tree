name: Temporary formal checked-boundary migration

on:
  pull_request:
    paths:
      - migration/checked-boundaries031.cirru
      - .github/workflows/checked-boundaries031.yaml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit
          deps-file: deps.cirru
      - name: Apply reviewed boundary edits with official CLI
        run: |
          set -euo pipefail
          out=.calcit/checked-boundaries031
          mkdir -p "$out"
          git hash-object calcit.cirru > "$out/before-blob.txt"
          calcit edit transaction --file migration/checked-boundaries031.cirru --dry-run --format json > "$out/preview.json"
          revision="$(jq -er '.scoped_revision' "$out/preview.json")"
          jq -e '.changed == true and (.operations | length) == 10' "$out/preview.json"
          calcit edit transaction --file migration/checked-boundaries031.cirru --expect-revision "$revision" --format json > "$out/applied.json"
          calcit analyze program-diff HEAD --format json > "$out/program-diff.json"
          calcit query search assert-type --source project --format json > "$out/after-search.json"
          jq -e '.data.summary.matches == 0' "$out/after-search.json"
          cp calcit.cirru "$out/calcit.cirru"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: explain-ternary-checked-source
          path: .calcit/checked-boundaries031/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
